name: Build and Push WSL Docker Images

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      distributions:
        description: 'Comma-separated names; leave empty to build all AMD64 distributions'
        type: string
        default: ''
      force:
        description: Rebuild even when this source was already published
        type: boolean
        default: false
      publish:
        description: Push to registries after the container smoke test
        type: boolean
        default: true
  workflow_call:
    inputs:
      distributions:
        type: string
        default: ''
      force:
        type: boolean
        default: false
      publish:
        type: boolean
        default: true
    secrets:
      QUAY_ROBOT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test builder
        run: |
          go test ./...
          go vet ./...
      - name: Fetch and validate the upstream build matrix
        id: matrix
        env:
          DISTRIBUTIONS: ${{ inputs.distributions }}
        run: |
          matrix=$(go run . --matrix --distro "$DISTRIBUTIONS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo '### AMD64 build plan' >> "$GITHUB_STEP_SUMMARY"
          echo "$matrix" | jq -r '.include[] | "- \(.name): `\(.sha256)`"' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: wsl-image-${{ matrix.image }}
      cancel-in-progress: false
    env:
      ENTRY: ${{ toJSON(matrix) }}
      OWNER: ${{ github.repository_owner }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
      QUAY_ENABLED: ${{ secrets.QUAY_ROBOT_TOKEN != '' && vars.QUAY_ENABLED != 'false' }}
      QUAY_REPOSITORY: ${{ vars.QUAY_REPOSITORY || 'quay.io/wsl-images/images' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Look up successful publication
        id: published
        if: env.PUBLISH == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-success
          key: published-v2-${{ matrix.image }}-${{ matrix.sha256 }}-${{ hashFiles('*.go', 'go.mod', '.github/workflows/build-wsl-images.yml') }}-${{ env.QUAY_ENABLED }}-${{ env.QUAY_REPOSITORY }}
          lookup-only: true
      - name: Decide whether to build
        id: decision
        env:
          FORCE: ${{ inputs.force }}
          CACHE_HIT: ${{ steps.published.outputs.cache-hit }}
        run: |
          if [[ "$FORCE" == 'true' || "$PUBLISH" != 'true' || "$CACHE_HIT" != 'true' ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Already published this source with this builder.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.decision.outputs.build == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Check decompression tools
        if: steps.decision.outputs.build == 'true'
        run: |
          command -v xz
          command -v zstd
      - name: Log in to GHCR
        if: steps.decision.outputs.build == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to optional Quay mirror
        id: quay
        if: steps.decision.outputs.build == 'true' && env.PUBLISH == 'true' && env.QUAY_ENABLED == 'true'
        continue-on-error: true # GHCR can still publish if the mirror login fails.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME || 'wsl-images+builder' }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Verify checksum, import, smoke-test, and publish
        id: build
        if: steps.decision.outputs.build == 'true'
        env:
          QUAY_LOGIN: ${{ steps.quay.outcome }}
        run: |
          args=(--entry "$ENTRY" --owner "$OWNER")
          if [[ "$PUBLISH" == 'true' ]]; then
            args+=(--push)
          fi
          if [[ "$QUAY_LOGIN" == 'success' ]]; then
            args+=(--quay-repository "$QUAY_REPOSITORY")
          fi
          go run . "${args[@]}"
      - name: Report failed mirror login
        if: steps.quay.outcome == 'failure'
        run: |
          echo '::error::GHCR was attempted independently, but Quay login failed. Repair QUAY_ROBOT_TOKEN or set QUAY_ENABLED=false.'
          exit 1
      - name: Record successful publication
        if: steps.build.outcome == 'success' && env.PUBLISH == 'true'
        run: printf '%s\n' "$ENTRY" > .build-success
      - name: Cache success only after every enabled registry succeeds
        if: steps.build.outcome == 'success' && env.PUBLISH == 'true' && steps.published.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-success
          key: ${{ steps.published.outputs.cache-primary-key }}
      - name: Build summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "### $(jq -r .name <<< "$ENTRY")"
            echo "Job: $RESULT; build step: $BUILD_OUTCOME; publishing: $PUBLISH"
            echo "Upstream SHA256: $(jq -r .sha256 <<< "$ENTRY")"
          } >> "$GITHUB_STEP_SUMMARY"
