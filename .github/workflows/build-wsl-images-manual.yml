name: Manual Rebuild of WSL Docker Images

on:
  workflow_dispatch:
    inputs:
      distributions:
        description: 'Comma-separated names; leave empty for all AMD64 distributions'
        type: string
        default: ''
      publish:
        description: Push to registries after the container smoke test
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  rebuild:
    uses: ./.github/workflows/build-wsl-images.yml
    with:
      distributions: ${{ inputs.distributions }}
      force: true
      publish: ${{ inputs.publish }}
    secrets: inherit
